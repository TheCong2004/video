[package]
name = "concat-studio-preview"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

# Isolated software-only UI review: no Tauri, browser or media engine.
[workspace]
resolver = "3"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
serde_json = "1"
png = "0.17"

[build-dependencies]
slint-build = "=1.18.1"
