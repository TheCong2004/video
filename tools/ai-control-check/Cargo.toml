[package]
name = "concat-ai-control-check"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
resolver = "3"
[dependencies]
concat-studio = {path="../../src/crates/concat-studio"}
concat-host = {path="../../src/crates/concat-host", features=["gpu"]}
concat-media = {path="../../src/crates/concat-media"}
serde = {version="1",features=["derive"]}
serde_json = "1"
sha2 = "0.10"
rfd = "0.17"
opener = { version = "0.8", features = ["reveal"] }
slint = {version="=1.18.1",default-features=false,features=["std","renderer-software","compat-1-2"]}
[build-dependencies]
slint-build = "=1.18.1"
[profile.dev]
debug=0
incremental=false
[profile.dev.package."*"]
opt-level=2
