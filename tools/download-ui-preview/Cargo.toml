[package]
name = "concat-download-ui-preview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
i-slint-core = { version = "=1.18.1", default-features = false, features = ["image-decoders", "image-default-formats"] }
png = "0.17"
serde_json = "1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.dev.package.concat-download-ui-preview]
debug = 0
incremental = false
