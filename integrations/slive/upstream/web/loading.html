<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Slive Vip</title>
  <link rel="shortcut icon" href="favicon.png" type="image/png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#073348 0,#07111f 38%,#090b19 70%,#1b0923 100%);color:#eaf8ff;font-family:Segoe UI,Arial,sans-serif}.card{width:min(520px,calc(100vw - 40px));padding:38px;border:1px solid #14526a;border-radius:20px;background:#0b1426e8;box-shadow:0 24px 80px #0009;text-align:center}.brand{font-size:26px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#00e9ff,#42a5ff,#ff43a4);color:transparent;background-clip:text}.spinner{width:52px;height:52px;margin:28px auto;border:4px solid #15364b;border-top-color:#00e9ff;border-radius:50%;animation:spin .8s linear infinite}.status{min-height:48px;color:#adc3d5;line-height:1.5}.track{height:8px;margin-top:20px;background:#132237;border-radius:99px;overflow:hidden}.bar{height:100%;width:8%;background:linear-gradient(90deg,#00e9ff,#00baef,#14c991);transition:width .35s}.error{display:none;margin-top:18px;padding:14px;border:1px solid #8d2a44;border-radius:10px;background:#35101c;color:#ffbdcb;white-space:pre-wrap;text-align:left}.hint{margin-top:16px;color:#647d93;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body><main class="card"><img src="favicon.png" style="width:72px;height:72px;margin:0 auto 16px;display:block;filter:drop-shadow(0 0 16px rgba(0,233,255,0.45));" alt="Slive Vip"><div class="brand">Slive Vip</div><div class="spinner" id="spinner"></div><div class="status" id="status">Đang chuẩn bị dịch vụ...</div><div class="track"><div class="bar" id="bar"></div></div><div class="error" id="error"></div><div class="hint">Lần mở đầu tiên có thể mất 1–2 phút để khởi tạo và tối ưu hóa không gian Slive Vip.</div></main>
<script>
function updateStatus(message,percent){const p=Math.max(5,Math.min(100,percent||5));document.getElementById('status').textContent=message+' ('+p+'%)';document.getElementById('bar').style.width=p+'%'}
updateStatus('Đang chuẩn bị dịch vụ...', 5);
function showError(message){document.getElementById('spinner').style.display='none';document.getElementById('status').textContent='Không thể khởi động';const e=document.getElementById('error');e.textContent=message;e.style.display='block';document.getElementById('bar').style.background='#ff316c'}
</script></body></html>
