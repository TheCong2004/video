<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>SLive TikTok Auto-Pin Helper</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #060913;
      color: #cbd5e1;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #00f0ff;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    .status-offline {
      background: rgba(255, 0, 85, 0.2);
      color: #ff0055;
    }
    .card {
      background: rgba(13, 20, 38, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #00f0ff;
      color: #060913;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      margin-top: 8px;
    }
    .btn:hover {
      background: #00c8ff;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ SLive Auto-Pin</div>
    <div id="status-badge" class="status-badge status-offline">Đang kiểm tra...</div>
  </div>

  <div class="card">
    <div style="margin-bottom: 6px;"><strong>Máy chủ SLive:</strong> <span id="server-status">http://127.0.0.1:5000</span></div>
    <div style="margin-bottom: 6px;"><strong>Sản phẩm đang ghim:</strong> <span id="pinned-product" style="color: #00f0ff;">-</span></div>
    <div><strong>Phiên bản:</strong> 1.0.4</div>
  </div>

  <button id="btn-open-dashboard" class="btn">Mở TikTok Shop Live Dashboard</button>
  <button id="btn-test-ping" class="btn btn-secondary">Kiểm tra kết nối App</button>

  <script src="popup.js"></script>
</body>
</html>
